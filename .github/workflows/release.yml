# Construit l'installateur Windows de Home Butler et le joint à une release GitHub (en brouillon,
# à relire puis publier depuis l'onglet Releases) à chaque tag de version poussé :
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Même enchaînement que scripts/build-all.sh : jar Spring -> ressources Tauri -> build Tauri.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Évite de publier une release dont l'installateur porte un autre numéro que le tag.
      - name: Vérification de la version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $APP_VERSION de tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Build du backend Spring
        working-directory: backend
        run: mvn -B clean package -DskipTests

      - name: Copie du jar dans les ressources Tauri
        run: |
          JAR_FILE=$(find backend/target -maxdepth 1 -name "*.jar" ! -name "*.original" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "::error::Aucun jar trouvé dans backend/target"
            exit 1
          fi
          mkdir -p frontend/src-tauri/resources
          cp "$JAR_FILE" frontend/src-tauri/resources/backend.jar

      - name: Installation des dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Build Tauri et création de la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Home Butler ${{ github.ref_name }}
          releaseBody: |
            Installateurs Windows de Home Butler (MSI ou setup .exe, au choix).

            **Prérequis** : Java 25 doit être installé et accessible dans le PATH (l'application démarre son backend avec `java`), ainsi qu'une base MariaDB à renseigner dans Configuration > Base de données au premier lancement (voir `scripts/mariadb-schema.sql`).
          releaseDraft: true
          prerelease: false
