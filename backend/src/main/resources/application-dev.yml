# Profil de développement : base H2 embarquée dans un fichier local, aucune configuration
# nécessaire. Actif par défaut (voir application.yml) — utilisé par "mvn spring-boot:run" et par
# "tauri dev". Le jar packagé pour la distribution force le profil "prod" à la place
# (voir spring_launcher.rs) et n'utilise donc jamais cette configuration.
spring:
  datasource:
    url: jdbc:h2:file:./data/home-butler;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
