server:
  port: 8080

app:
  version: "@project.version@"

spring:
  # Profil actif par défaut : "dev" (H2 embarqué, voir application-dev.yml), pratique pour lancer
  # le backend seul (mvn spring-boot:run) sans rien configurer. Le jar packagé pour l'app Tauri
  # force explicitement le profil "prod" au lancement (voir spring_launcher.rs) : aucune base
  # n'est fournie par défaut hors dev, voir application-prod.yml.
  profiles:
    active: dev

  application:
    name: home-butler

  data:
    jpa:
      repositories:
        # Bootstrap paresseux des repositories Spring Data (par défaut ils sont initialisés
        # au démarrage). Complète le ddl-auto: none généré pour la config MariaDB (voir
        # DatabaseConfigService) : c'est ce dernier qui évite le blocage au démarrage si la
        # base est injoignable — ce réglage-ci ne fait qu'éviter un travail inutile en plus.
        bootstrap-mode: lazy

  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    sds.home.homebutler: DEBUG
